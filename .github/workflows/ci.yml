name: CI / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test:coverage

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trigger infra redeploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'PaAmbTomaquetYOle',
              repo: 'infra',
              event_type: 'slack-agent-updated',
              client_payload: {
                source_repository: context.repo.repo,
                source_sha: context.sha,
              },
            });

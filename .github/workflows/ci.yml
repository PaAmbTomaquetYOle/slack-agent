name: CI / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test:coverage

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Slack CLI
        run: curl -fsSL https://downloads.slack-edge.com/slack-cli/install.sh | bash

      - name: Add Slack CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate and deploy Slack app
        run: |
          slack login --token "$SLACK_SERVICE_TOKEN" --team "$SLACK_TEAM_ID" --skip-update --no-color --force
          slack app list --team "$SLACK_TEAM_ID" --skip-update --no-color --force
          slack deploy --hide-triggers --team "$SLACK_TEAM_ID" --skip-update --no-color --force
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}

      - name: Trigger infra redeploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'PaAmbTomaquetYOle',
              repo: 'infra',
              event_type: 'slack-agent-updated',
              client_payload: {
                source_repository: context.repo.repo,
                source_sha: context.sha,
              },
            });

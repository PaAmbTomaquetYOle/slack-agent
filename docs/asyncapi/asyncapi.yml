asyncapi: 3.0.0
info:
  title: OffboardMe — Kafka Event Contract
  version: 1.0.0
  description: >
    Machine-readable contract for the Kafka events exchanged between the
    `backend` (OffboardMe FastAPI service) and `slack-agent`. This is the
    single source of truth for the event contract defined in BE-9 (#16) and
    formalized in BE-11 (#18) — it supersedes the prose table that used to
    live only in `README.md`.


    ## Envelope

    Every message (both directions) uses the same JSON envelope, produced by
    `DomainEvent.to_dict()` in `src/app/domain/events/base.py`:

    ```json
    { "event_id": "<uuid>", "event_type": "<string>", "occurred_at": "<ISO-8601 UTC>", "payload": { ... } }
    ```


    ## Kafka message key

    The Kafka record key is `payload.process_id` when present, otherwise it
    falls back to `event_id` (see `kafka_event_publisher.py`). This partitions
    delivery by offboarding process.


    ## Delivery semantics

    Consumption is at-least-once: offsets are committed manually only after a
    message is either dispatched successfully or routed to the dead-letter
    queue — a malformed message or handler failure never blocks the consumer.


    ## Topic namespacing

    Topics are namespaced by direction so the backend never re-consumes what
    it just produced:
    - `slack-agent.*` — inbound, published by slack-agent, consumed by backend.
    - `offboarding.*` — outbound, published by backend, consumed by slack-agent.

    Writes (create, cancel, lifecycle transitions, dossier generation, SOP
    creation) are Kafka-only. The REST API is read-only (GET/list/search plus
    POST /auth/token) — slack-agent and mcp-server must produce/consume these
    events rather than call REST write endpoints.
  license:
    name: UNLICENSED

servers:
  kafka:
    host: '{KAFKA_BOOTSTRAP_SERVERS}'
    protocol: kafka
    description: Shared Kafka cluster used by backend and slack-agent.
    variables:
      KAFKA_BOOTSTRAP_SERVERS:
        default: localhost:9092
        description: Value of the `KAFKA_BOOTSTRAP_SERVERS` env var.

defaultContentType: application/json

channels:
  # ---------------------------------------------------------------------
  # Inbound — published by slack-agent, consumed by backend.
  # Prefix `slack-agent` (KAFKA_INBOUND_TOPIC_PREFIX).
  # Consumer group `offboardme-backend-consumer` (KAFKA_CONSUMER_GROUP_ID).
  # ---------------------------------------------------------------------
  slackAgentOffboardingTriggered:
    address: slack-agent.offboarding.triggered
    description: Creates the offboarding process and starts it.
    messages:
      offboardingTriggered:
        $ref: '#/components/messages/OffboardingTriggered'

  slackAgentOffboardingCancellationRequested:
    address: slack-agent.offboarding.cancellation_requested
    description: Cancels the offboarding process.
    messages:
      offboardingCancellationRequested:
        $ref: '#/components/messages/OffboardingCancellationRequested'

  slackAgentInterviewStarted:
    address: slack-agent.interview.started
    description: >
      Records that the interview for an offboarding process has begun.
      Idempotent: if the interview is already past SCHEDULED (redelivery, or
      `interview.completed` already handled it), the start transition is
      skipped instead of raising.
    messages:
      interviewStartedInbound:
        $ref: '#/components/messages/InterviewStartedInbound'

  slackAgentInterviewCompleted:
    address: slack-agent.interview.completed
    description: >
      Saves the collected interview answers, completes the interview, and
      submits the offboarding process for review.
    messages:
      interviewCompletedInbound:
        $ref: '#/components/messages/InterviewCompletedInbound'

  slackAgentInterviewTurnRecorded:
    address: slack-agent.interview.turn_recorded
    description: >
      Appends newly recorded turns to the process's interview incrementally
      (SA-16), instead of only receiving the full turn list at
      `interview.completed`. Kafka delivery across topics is not ordered, so
      the handler creates/starts the interview defensively and dedups by
      turn order to stay idempotent under at-least-once redelivery.
    messages:
      interviewTurnRecorded:
        $ref: '#/components/messages/InterviewTurnRecorded'

  slackAgentDossierGenerationRequested:
    address: slack-agent.dossier.generation_requested
    description: >
      Generates and persists the dossier (interview content is read from the
      database, not carried in the payload), then completes the offboarding
      process.
    messages:
      dossierGenerationRequested:
        $ref: '#/components/messages/DossierGenerationRequested'

  slackAgentSopCreationRequested:
    address: slack-agent.sop.creation_requested
    description: Creates a SOP from a Slack-originated request.
    messages:
      sopCreationRequested:
        $ref: '#/components/messages/SopCreationRequested'

  slackAgentSopCandidateOffered:
    address: slack-agent.sop.candidate_offered
    description: >
      Persists that a candidate message was offered to its author as a
      possible SOP (SA-16), so a slack-agent restart before the author
      responds doesn't lose the candidate.
    messages:
      sopCandidateOffered:
        $ref: '#/components/messages/SopCandidateOffered'

  slackAgentSopCandidateDecided:
    address: slack-agent.sop.candidate_decided
    description: >
      Records the author's accept/reject decision for a previously offered
      SOP candidate (SA-16). The SOP itself is still only created, on
      acceptance, via `sop.creation_requested`.
    messages:
      sopCandidateDecided:
        $ref: '#/components/messages/SopCandidateDecided'

  slackAgentKnowledgeInteractionRegistered:
    address: slack-agent.knowledge_graph.interaction_registered
    description: >
      Records that a person interacted with a topic (knows about it, or
      answered about it in an interview) in the Neo4j knowledge graph.
    messages:
      knowledgeInteractionRegistered:
        $ref: '#/components/messages/KnowledgeInteractionRegistered'

  slackAgentKnowledgeDocumentRegistered:
    address: slack-agent.knowledge_graph.document_registered
    description: >
      Records a document, its author, and the topics it references in the
      knowledge graph.
    messages:
      knowledgeDocumentRegistered:
        $ref: '#/components/messages/KnowledgeDocumentRegistered'

  slackAgentKnowledgeChannelActivityRegistered:
    address: slack-agent.knowledge_graph.channel_activity_registered
    description: Records that a person is active in a Slack channel.
    messages:
      knowledgeChannelActivityRegistered:
        $ref: '#/components/messages/KnowledgeChannelActivityRegistered'

  # ---------------------------------------------------------------------
  # Outbound — published by backend, consumed by slack-agent.
  # Prefix `offboarding` (KAFKA_TOPIC_PREFIX).
  # ---------------------------------------------------------------------
  offboardingOffboardingStateChanged:
    address: offboarding.offboarding.state_changed
    description: The offboarding process transitioned to a new state.
    messages:
      offboardingStateChanged:
        $ref: '#/components/messages/OffboardingStateChanged'

  offboardingInterviewCompleted:
    address: offboarding.interview.completed
    description: The backend finished persisting a completed interview.
    messages:
      interviewCompletedOutbound:
        $ref: '#/components/messages/InterviewCompletedOutbound'

  offboardingDossierGenerated:
    address: offboarding.dossier.generated
    description: A dossier was generated and persisted for a process.
    messages:
      dossierGenerated:
        $ref: '#/components/messages/DossierGenerated'

  offboardingOffboardingCompleted:
    address: offboarding.offboarding.completed
    description: The offboarding process finished end-to-end.
    messages:
      offboardingCompleted:
        $ref: '#/components/messages/OffboardingCompleted'

  offboardingSopCreated:
    address: offboarding.sop.created
    description: A SOP (Standard Operating Procedure) document was created.
    messages:
      sopCreated:
        $ref: '#/components/messages/SopCreated'

  offboardingKnowledgeGraphUpdated:
    address: offboarding.knowledge_graph.updated
    description: >
      Notifies that a node or relationship was written to the knowledge
      graph. A lightweight, best-effort notification — published defensively
      and never blocks the write it follows.
    messages:
      knowledgeGraphUpdated:
        $ref: '#/components/messages/KnowledgeGraphUpdated'

  # ---------------------------------------------------------------------
  # Dead-letter queue — single fixed topic for both directions.
  # ---------------------------------------------------------------------
  offboardingDlq:
    address: offboarding.dlq
    description: >
      Malformed envelopes or handler failures are republished here verbatim
      (original bytes, not re-encoded) with headers `source_topic` (the topic
      the failing message came from) and `error` (the failure reason). The
      offset of the original message is committed regardless, so a bad
      message never blocks or crashes the consumer.
    messages:
      deadLetter:
        $ref: '#/components/messages/DeadLetter'

operations:
  onOffboardingTriggered:
    action: receive
    channel:
      $ref: '#/channels/slackAgentOffboardingTriggered'
    messages:
      - $ref: '#/channels/slackAgentOffboardingTriggered/messages/offboardingTriggered'

  onOffboardingCancellationRequested:
    action: receive
    channel:
      $ref: '#/channels/slackAgentOffboardingCancellationRequested'
    messages:
      - $ref: '#/channels/slackAgentOffboardingCancellationRequested/messages/offboardingCancellationRequested'

  onInterviewStarted:
    action: receive
    channel:
      $ref: '#/channels/slackAgentInterviewStarted'
    messages:
      - $ref: '#/channels/slackAgentInterviewStarted/messages/interviewStartedInbound'

  onInterviewCompletedInbound:
    action: receive
    channel:
      $ref: '#/channels/slackAgentInterviewCompleted'
    messages:
      - $ref: '#/channels/slackAgentInterviewCompleted/messages/interviewCompletedInbound'

  onInterviewTurnRecorded:
    action: receive
    channel:
      $ref: '#/channels/slackAgentInterviewTurnRecorded'
    messages:
      - $ref: '#/channels/slackAgentInterviewTurnRecorded/messages/interviewTurnRecorded'

  onDossierGenerationRequested:
    action: receive
    channel:
      $ref: '#/channels/slackAgentDossierGenerationRequested'
    messages:
      - $ref: '#/channels/slackAgentDossierGenerationRequested/messages/dossierGenerationRequested'

  onSopCreationRequested:
    action: receive
    channel:
      $ref: '#/channels/slackAgentSopCreationRequested'
    messages:
      - $ref: '#/channels/slackAgentSopCreationRequested/messages/sopCreationRequested'

  onSopCandidateOffered:
    action: receive
    channel:
      $ref: '#/channels/slackAgentSopCandidateOffered'
    messages:
      - $ref: '#/channels/slackAgentSopCandidateOffered/messages/sopCandidateOffered'

  onSopCandidateDecided:
    action: receive
    channel:
      $ref: '#/channels/slackAgentSopCandidateDecided'
    messages:
      - $ref: '#/channels/slackAgentSopCandidateDecided/messages/sopCandidateDecided'

  onKnowledgeInteractionRegistered:
    action: receive
    channel:
      $ref: '#/channels/slackAgentKnowledgeInteractionRegistered'
    messages:
      - $ref: '#/channels/slackAgentKnowledgeInteractionRegistered/messages/knowledgeInteractionRegistered'

  onKnowledgeDocumentRegistered:
    action: receive
    channel:
      $ref: '#/channels/slackAgentKnowledgeDocumentRegistered'
    messages:
      - $ref: '#/channels/slackAgentKnowledgeDocumentRegistered/messages/knowledgeDocumentRegistered'

  onKnowledgeChannelActivityRegistered:
    action: receive
    channel:
      $ref: '#/channels/slackAgentKnowledgeChannelActivityRegistered'
    messages:
      - $ref: '#/channels/slackAgentKnowledgeChannelActivityRegistered/messages/knowledgeChannelActivityRegistered'

  sendOffboardingStateChanged:
    action: send
    channel:
      $ref: '#/channels/offboardingOffboardingStateChanged'
    messages:
      - $ref: '#/channels/offboardingOffboardingStateChanged/messages/offboardingStateChanged'

  sendInterviewCompletedOutbound:
    action: send
    channel:
      $ref: '#/channels/offboardingInterviewCompleted'
    messages:
      - $ref: '#/channels/offboardingInterviewCompleted/messages/interviewCompletedOutbound'

  sendDossierGenerated:
    action: send
    channel:
      $ref: '#/channels/offboardingDossierGenerated'
    messages:
      - $ref: '#/channels/offboardingDossierGenerated/messages/dossierGenerated'

  sendOffboardingCompleted:
    action: send
    channel:
      $ref: '#/channels/offboardingOffboardingCompleted'
    messages:
      - $ref: '#/channels/offboardingOffboardingCompleted/messages/offboardingCompleted'

  sendSopCreated:
    action: send
    channel:
      $ref: '#/channels/offboardingSopCreated'
    messages:
      - $ref: '#/channels/offboardingSopCreated/messages/sopCreated'

  sendKnowledgeGraphUpdated:
    action: send
    channel:
      $ref: '#/channels/offboardingKnowledgeGraphUpdated'
    messages:
      - $ref: '#/channels/offboardingKnowledgeGraphUpdated/messages/knowledgeGraphUpdated'

  sendDeadLetter:
    action: send
    channel:
      $ref: '#/channels/offboardingDlq'
    messages:
      - $ref: '#/channels/offboardingDlq/messages/deadLetter'

components:
  messages:
    OffboardingTriggered:
      name: offboarding.triggered
      title: Offboarding triggered
      summary: Requests creation of a new offboarding process.
      payload:
        $ref: '#/components/schemas/OffboardingTriggeredEnvelope'

    OffboardingCancellationRequested:
      name: offboarding.cancellation_requested
      title: Offboarding cancellation requested
      summary: Requests cancellation of an offboarding process.
      payload:
        $ref: '#/components/schemas/OffboardingCancellationRequestedEnvelope'

    InterviewStartedInbound:
      name: interview.started
      title: Interview started (inbound)
      summary: Signals that an offboarding interview has begun.
      payload:
        $ref: '#/components/schemas/InterviewStartedInboundEnvelope'

    InterviewCompletedInbound:
      name: interview.completed
      title: Interview completed (inbound)
      summary: Delivers the collected interview turns for a process.
      payload:
        $ref: '#/components/schemas/InterviewCompletedInboundEnvelope'

    InterviewTurnRecorded:
      name: interview.turn_recorded
      title: Interview turn(s) recorded
      summary: Delivers newly recorded interview turns to persist incrementally.
      payload:
        $ref: '#/components/schemas/InterviewTurnRecordedEnvelope'

    DossierGenerationRequested:
      name: dossier.generation_requested
      title: Dossier generation requested
      summary: Requests dossier generation for a process.
      payload:
        $ref: '#/components/schemas/DossierGenerationRequestedEnvelope'

    SopCreationRequested:
      name: sop.creation_requested
      title: SOP creation requested
      summary: Requests creation of a SOP from a Slack-originated request.
      payload:
        $ref: '#/components/schemas/SopCreationRequestedEnvelope'

    SopCandidateOffered:
      name: sop.candidate_offered
      title: SOP candidate offered
      summary: A candidate message was offered to its author as a possible SOP.
      payload:
        $ref: '#/components/schemas/SopCandidateOfferedEnvelope'

    SopCandidateDecided:
      name: sop.candidate_decided
      title: SOP candidate decided
      summary: The author accepted or rejected a previously offered SOP candidate.
      payload:
        $ref: '#/components/schemas/SopCandidateDecidedEnvelope'

    KnowledgeInteractionRegistered:
      name: knowledge_graph.interaction_registered
      title: Knowledge graph interaction registered
      summary: Records that a person interacted with a topic in the knowledge graph.
      payload:
        $ref: '#/components/schemas/KnowledgeInteractionRegisteredEnvelope'

    KnowledgeDocumentRegistered:
      name: knowledge_graph.document_registered
      title: Knowledge graph document registered
      summary: >
        Records a document, its author, and the topics it references in the
        knowledge graph.
      payload:
        $ref: '#/components/schemas/KnowledgeDocumentRegisteredEnvelope'

    KnowledgeChannelActivityRegistered:
      name: knowledge_graph.channel_activity_registered
      title: Knowledge graph channel activity registered
      summary: Records that a person is active in a Slack channel.
      payload:
        $ref: '#/components/schemas/KnowledgeChannelActivityRegisteredEnvelope'

    OffboardingStateChanged:
      name: offboarding.state_changed
      title: Offboarding state changed
      summary: The offboarding process transitioned to a new state.
      payload:
        $ref: '#/components/schemas/OffboardingStateChangedEnvelope'

    InterviewCompletedOutbound:
      name: interview.completed
      title: Interview completed (outbound)
      summary: Notifies that the backend finished persisting a completed interview.
      payload:
        $ref: '#/components/schemas/InterviewCompletedOutboundEnvelope'

    DossierGenerated:
      name: dossier.generated
      title: Dossier generated
      summary: A dossier was generated and persisted for a process.
      payload:
        $ref: '#/components/schemas/DossierGeneratedEnvelope'

    OffboardingCompleted:
      name: offboarding.completed
      title: Offboarding completed
      summary: The offboarding process finished end-to-end.
      payload:
        $ref: '#/components/schemas/OffboardingCompletedEnvelope'

    SopCreated:
      name: sop.created
      title: SOP created
      summary: A SOP document was created.
      payload:
        $ref: '#/components/schemas/SopCreatedEnvelope'

    KnowledgeGraphUpdated:
      name: knowledge_graph.updated
      title: Knowledge graph updated
      summary: A node or relationship was written to the knowledge graph.
      payload:
        $ref: '#/components/schemas/KnowledgeGraphUpdatedEnvelope'

    DeadLetter:
      name: dead_letter
      title: Dead letter
      summary: >
        A message that failed deserialization or handling, republished
        verbatim with failure metadata in headers.
      headers:
        type: object
        properties:
          source_topic:
            type: string
            description: The original topic the failing message was consumed from.
          error:
            type: string
            description: String representation of the exception that caused the failure.
        required: [source_topic, error]
      payload:
        description: >
          The original, unmodified message bytes. May or may not be a valid
          DomainEvent envelope — that is exactly what failed.
        type: object

  schemas:
    DomainEventEnvelopeBase:
      type: object
      description: Shared envelope fields, common to every event in both directions.
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique identifier of this event instance.
        event_type:
          type: string
          description: Discriminator matching one of the `event_type` values in this contract.
        occurred_at:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of when the event occurred.
      required: [event_id, event_type, occurred_at]

    InterviewTurn:
      type: object
      description: >
        One turn of an interview transcript. `answer_text` only applies when
        `turn_type` is `question`.
      properties:
        turn_type:
          type: string
          enum: [question, note]
        speaker_role:
          type: string
          enum: [interviewer, interviewee]
        timestamp:
          type: string
          format: date-time
        content:
          type: string
        order:
          type: integer
        topic:
          type: string
          nullable: true
        sentiment:
          type: string
          nullable: true
        answer_text:
          type: string
          nullable: true
          description: Only present/meaningful when `turn_type` is `question`.
      required: [turn_type, speaker_role, timestamp, content, order]

    # --- Inbound payloads --------------------------------------------

    OffboardingTriggeredPayload:
      type: object
      properties:
        employee_id:
          type: string
        manager_id:
          type: string
        employee_name:
          type: string
          nullable: true
        manager_name:
          type: string
          nullable: true
      required: [employee_id, manager_id]

    OffboardingTriggeredEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: offboarding.triggered
            payload:
              $ref: '#/components/schemas/OffboardingTriggeredPayload'
          required: [payload]

    OffboardingCancellationRequestedPayload:
      type: object
      properties:
        process_id:
          type: string
          format: uuid
      required: [process_id]

    OffboardingCancellationRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: offboarding.cancellation_requested
            payload:
              $ref: '#/components/schemas/OffboardingCancellationRequestedPayload'
          required: [payload]

    InterviewStartedInboundPayload:
      type: object
      description: >
        `process_id` is the offboarding process this interview belongs to.
        The handler docstring also mentions `employee_id`, but it is not
        actually read (the process already knows its employee).
      properties:
        process_id:
          type: string
          format: uuid
      required: [process_id]

    InterviewStartedInboundEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: interview.started
            payload:
              $ref: '#/components/schemas/InterviewStartedInboundPayload'
          required: [payload]

    InterviewCompletedInboundPayload:
      type: object
      properties:
        process_id:
          type: string
          format: uuid
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
      required: [process_id]

    InterviewCompletedInboundEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: interview.completed
            payload:
              $ref: '#/components/schemas/InterviewCompletedInboundPayload'
          required: [payload]

    InterviewTurnRecordedPayload:
      type: object
      description: >
        Same shape as InterviewCompletedInboundPayload — turns are appended
        to the process's interview rather than replacing the full set.
      properties:
        process_id:
          type: string
          format: uuid
        turns:
          type: array
          items:
            $ref: '#/components/schemas/InterviewTurn'
      required: [process_id]

    InterviewTurnRecordedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: interview.turn_recorded
            payload:
              $ref: '#/components/schemas/InterviewTurnRecordedPayload'
          required: [payload]

    DossierGenerationRequestedPayload:
      type: object
      description: >
        Only `process_id` is carried — the interview content is read from
        the database (source of truth), not from the event payload.
      properties:
        process_id:
          type: string
          format: uuid
      required: [process_id]

    DossierGenerationRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: dossier.generation_requested
            payload:
              $ref: '#/components/schemas/DossierGenerationRequestedPayload'
          required: [payload]

    SopCreationRequestedPayload:
      type: object
      properties:
        content:
          type: string
        author:
          type: string
        origin_channel:
          type: string
        tags:
          type: array
          items:
            type: string
          nullable: true
      required: [content, author, origin_channel]

    SopCreationRequestedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: sop.creation_requested
            payload:
              $ref: '#/components/schemas/SopCreationRequestedPayload'
          required: [payload]

    SopCandidateOfferedPayload:
      type: object
      properties:
        channel_id:
          type: string
        author_id:
          type: string
        message_ts:
          type: string
          description: Slack message timestamp identifying the candidate, unique within its channel.
        content:
          type: string
      required: [channel_id, author_id, message_ts, content]

    SopCandidateOfferedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: sop.candidate_offered
            payload:
              $ref: '#/components/schemas/SopCandidateOfferedPayload'
          required: [payload]

    SopCandidateDecidedPayload:
      type: object
      properties:
        channel_id:
          type: string
        message_ts:
          type: string
        accepted:
          type: boolean
      required: [channel_id, message_ts, accepted]

    SopCandidateDecidedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: sop.candidate_decided
            payload:
              $ref: '#/components/schemas/SopCandidateDecidedPayload'
          required: [payload]

    KnowledgeInteractionRegisteredPayload:
      type: object
      properties:
        person_id:
          type: string
          description: External Slack user ID of the person.
        person_name:
          type: string
        topic_name:
          type: string
        interaction_type:
          type: string
          enum: [knows, answered]
          description: >
            "knows" creates/strengthens a KNOWS_ABOUT relationship; "answered"
            creates an ANSWERED_ABOUT relationship (from an interview answer).
        department:
          type: string
          nullable: true
        topic_description:
          type: string
          nullable: true
      required: [person_id, person_name, topic_name, interaction_type]

    KnowledgeInteractionRegisteredEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: knowledge_graph.interaction_registered
            payload:
              $ref: '#/components/schemas/KnowledgeInteractionRegisteredPayload'
          required: [payload]

    KnowledgeDocumentRegisteredPayload:
      type: object
      properties:
        document_id:
          type: string
        title:
          type: string
        author_id:
          type: string
          description: External Slack user ID of the document's author.
        author_name:
          type: string
        topics:
          type: array
          items:
            type: string
          description: Topic names this document references.
        url:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
      required: [document_id, title, author_id, author_name, topics]

    KnowledgeDocumentRegisteredEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: knowledge_graph.document_registered
            payload:
              $ref: '#/components/schemas/KnowledgeDocumentRegisteredPayload'
          required: [payload]

    KnowledgeChannelActivityRegisteredPayload:
      type: object
      properties:
        person_id:
          type: string
        person_name:
          type: string
        channel_id:
          type: string
        channel_name:
          type: string
      required: [person_id, person_name, channel_id, channel_name]

    KnowledgeChannelActivityRegisteredEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: knowledge_graph.channel_activity_registered
            payload:
              $ref: '#/components/schemas/KnowledgeChannelActivityRegisteredPayload'
          required: [payload]

    # --- Outbound payloads --------------------------------------------

    OffboardingStateChangedPayload:
      type: object
      properties:
        process_id:
          type: string
          format: uuid
        previous_state:
          type: string
          enum: [not_started, in_progress, pending_revision, finished, cancelled]
        new_state:
          type: string
          enum: [not_started, in_progress, pending_revision, finished, cancelled]
        employee_id:
          type: string
        manager_id:
          type: string
      required: [process_id, previous_state, new_state, employee_id, manager_id]

    OffboardingStateChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: offboarding.state_changed
            payload:
              $ref: '#/components/schemas/OffboardingStateChangedPayload'
          required: [payload]

    InterviewCompletedOutboundPayload:
      type: object
      properties:
        interview_id:
          type: string
          format: uuid
        process_id:
          type: string
          format: uuid
        completed_at:
          type: string
          format: date-time
      required: [interview_id, process_id, completed_at]

    InterviewCompletedOutboundEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: interview.completed
            payload:
              $ref: '#/components/schemas/InterviewCompletedOutboundPayload'
          required: [payload]

    DossierGeneratedPayload:
      type: object
      properties:
        dossier_id:
          type: string
          format: uuid
        process_id:
          type: string
          format: uuid
        interview_id:
          type: string
          format: uuid
      required: [dossier_id, process_id, interview_id]

    DossierGeneratedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: dossier.generated
            payload:
              $ref: '#/components/schemas/DossierGeneratedPayload'
          required: [payload]

    OffboardingCompletedPayload:
      type: object
      properties:
        process_id:
          type: string
          format: uuid
        employee_id:
          type: string
        manager_id:
          type: string
        dossier_id:
          type: string
          format: uuid
      required: [process_id, employee_id, manager_id, dossier_id]

    OffboardingCompletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: offboarding.completed
            payload:
              $ref: '#/components/schemas/OffboardingCompletedPayload'
          required: [payload]

    SopCreatedPayload:
      type: object
      description: >
        Unlike every other outbound payload, `tags` and `version` are not
        stringified — they are emitted as a genuine JSON array and integer.
      properties:
        sop_id:
          type: string
          format: uuid
        author:
          type: string
        origin_channel:
          type: string
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
      required: [sop_id, author, origin_channel, tags, version, created_at]

    SopCreatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: sop.created
            payload:
              $ref: '#/components/schemas/SopCreatedPayload'
          required: [payload]

    KnowledgeGraphUpdatedPayload:
      type: object
      properties:
        entity_type:
          type: string
          enum: [person, document]
        entity_id:
          type: string
        action:
          type: string
          enum: [interaction, created, activity]
      required: [entity_type, entity_id, action]

    KnowledgeGraphUpdatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelopeBase'
        - type: object
          properties:
            event_type:
              const: knowledge_graph.updated
            payload:
              $ref: '#/components/schemas/KnowledgeGraphUpdatedPayload'
          required: [payload]
